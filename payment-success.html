<!DOCTYPE html>
<html lang="en">
<head>
<script>
  // Apply theme before paint to prevent flash
  document.documentElement.setAttribute('data-theme', localStorage.getItem('dz_theme') || 'light');
  try {
    var _s = JSON.parse(localStorage.getItem('dz_settings') || '{}');
    if (_s.storeName) document.title = 'Payment Successful — ' + _s.storeName;
    document.documentElement.setAttribute('data-storename', _s.storeName || 'DigiStore DZ');
  } catch(e) {}
</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Payment Successful — DigiStore DZ</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
/* ============================================================
   DigiStore DZ — Payment Success Page
   Inherits the same design system as index.html
   ============================================================ */
:root {
  --accent:#10B981;--accent-rgb:16,185,129;--accent-dark:#059669;
  --bg:#0C0C0C;--bg2:#141414;--bg3:#1E1E1E;
  --text:#F2F2F2;--text-muted:#71717A;--text-subtle:#A1A1AA;
  --border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.13);
  --card:rgba(255,255,255,.03);
  --shadow:0 1px 3px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.25);
  --shadow-md:0 4px 20px rgba(0,0,0,.4);
  --radius:12px;--radius-sm:8px;--transition:.18s ease;
}
[data-theme="light"] {
  --bg:#FFFFFF;--bg2:#F4F4F5;--bg3:#E9E9EB;
  --text:#0A0A0A;--text-muted:#52525B;--text-subtle:#71717A;
  --border:rgba(0,0,0,.08);--border-strong:rgba(0,0,0,.13);
  --card:rgba(0,0,0,.025);
  --shadow:0 1px 3px rgba(0,0,0,.07),0 4px 12px rgba(0,0,0,.06);
  --shadow-md:0 4px 20px rgba(0,0,0,.1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body {
  background:var(--bg);color:var(--text);
  font-family:'DM Sans',sans-serif;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:2rem;
}
.page-card {
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:3rem 2.5rem;
  max-width:480px;width:100%;text-align:center;
  box-shadow:var(--shadow-md);
}

/* ── Animated success icon ─────────────────────────────── */
.icon-wrap {
  width:80px;height:80px;border-radius:50%;
  background:rgba(var(--accent-rgb),.12);
  border:2px solid rgba(var(--accent-rgb),.3);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 1.8rem;
  animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both;
}
.icon-wrap i { font-size:2rem; color:var(--accent); }
@keyframes popIn { from{opacity:0;transform:scale(.5)} to{opacity:1;transform:scale(1)} }

.page-title {
  font-family:'Syne',sans-serif;font-size:1.7rem;font-weight:800;
  margin-bottom:.6rem;color:var(--text);
  animation:fadeUp .5s .15s both;
}
.page-sub {
  color:var(--text-muted);font-size:.9rem;line-height:1.7;
  margin-bottom:2rem;animation:fadeUp .5s .22s both;
}

/* ── Info pill ─────────────────────────────────────────── */
.info-box {
  background:rgba(var(--accent-rgb),.06);
  border:1px solid rgba(var(--accent-rgb),.2);
  border-radius:var(--radius-sm);padding:1rem 1.2rem;
  margin-bottom:2rem;text-align:left;
  animation:fadeUp .5s .3s both;
}
.info-row {
  display:flex;justify-content:space-between;align-items:center;
  font-size:.83rem;padding:.25rem 0;
}
.info-row:not(:last-child){border-bottom:1px solid rgba(var(--accent-rgb),.1)}
.info-label{color:var(--text-muted)}
.info-val{font-weight:600;color:var(--accent)}

/* ── Actions ───────────────────────────────────────────── */
.actions{display:flex;flex-direction:column;gap:.75rem;animation:fadeUp .5s .38s both}
.btn-primary {
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 24px;border-radius:var(--radius-sm);
  background:var(--accent);color:#fff;font-weight:700;font-size:.9rem;
  cursor:pointer;border:none;font-family:inherit;
  transition:all var(--transition);text-decoration:none;
}
.btn-primary:hover{background:var(--accent-dark);transform:translateY(-1px)}
.btn-outline {
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 24px;border-radius:var(--radius-sm);
  background:transparent;border:1px solid var(--border-strong);
  color:var(--text);font-weight:600;font-size:.9rem;
  cursor:pointer;font-family:inherit;
  transition:all var(--transition);text-decoration:none;
}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}

/* ── Verification badge ────────────────────────────────── */
.verify-badge {
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:99px;font-size:.72rem;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;margin-top:1.5rem;
}
.verify-badge.verified   { background:rgba(var(--accent-rgb),.1);color:var(--accent); }
.verify-badge.unverified { background:rgba(245,158,11,.1);color:#F59E0B; }
.verify-badge.checking   { background:rgba(var(--accent-rgb),.06);color:var(--text-muted); }

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div class="page-card">
  <!-- Success Icon -->
  <div class="icon-wrap">
    <i class="fa-solid fa-circle-check"></i>
  </div>

  <h1 class="page-title">Payment Successful!</h1>
  <p class="page-sub">
    Thank you for your purchase. Your order has been placed and your products
    will appear in <strong>My Products</strong> shortly.
  </p>

  <!-- Order info box (populated by JS) -->
  <div class="info-box" id="info-box" style="display:none">
    <div class="info-row">
      <span class="info-label">Status</span>
      <span class="info-val" id="status-val">Paid ✓</span>
    </div>
    <div class="info-row">
      <span class="info-label">Payment method</span>
      <span class="info-val" id="method-val">—</span>
    </div>
    <div class="info-row" id="amount-row" style="display:none">
      <span class="info-label">Amount</span>
      <span class="info-val" id="amount-val">—</span>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <a href="my-products.html" class="btn-primary">
      <i class="fa-solid fa-box-open"></i> View My Products
    </a>
    <a href="index.html" class="btn-outline">
      <i class="fa-solid fa-store"></i> Back to Store
    </a>
  </div>

  <!-- Verification status badge (updated by JS) -->
  <div id="verify-badge" class="verify-badge checking">
    <i class="fa-solid fa-spinner fa-spin"></i> Verifying payment…
  </div>
</div>

<script>
// ================================================================
// payment-success.html — Client-side post-payment logic
// ================================================================
(function () {
  'use strict';

  // ── 1. Read meta from query string (passed by the backend) ───
  const params   = new URLSearchParams(window.location.search);
  const rawMeta  = params.get('meta');
  let meta = {};
  try { meta = JSON.parse(decodeURIComponent(rawMeta || '{}')); } catch (_) {}

  const checkoutId  = params.get('checkout_id') || '';
  // Chargily also passes ?checkout_id= in the redirect URL automatically

  // ── 2. Clear the cart in localStorage ───────────────────────
  try { localStorage.removeItem('dz_cart'); } catch (_) {}
  // Dispatch cart update event so any open page reflects empty cart
  window.dispatchEvent(new Event('cart:update'));

  // ── 3. Bust My Products cache so it reloads fresh ────────────
  if (meta.userId) {
    try { sessionStorage.removeItem('dz_mp_' + meta.userId); } catch (_) {}
  }

  // ── 4. Verify payment with our backend (shows real status) ──
  // The backend queries Chargily API and returns the checkout status.
  const backendUrl = window.DIGISTORE_BACKEND_URL || '';  // set by config block below
  const idToVerify = checkoutId;

  if (idToVerify && backendUrl) {
    fetch(`${backendUrl}/api/verify-checkout/${idToVerify}`)
      .then(r => r.json())
      .then(data => {
        const badge = document.getElementById('verify-badge');
        if (data.status === 'paid') {
          badge.className = 'verify-badge verified';
          badge.innerHTML = '<i class="fa-solid fa-shield-check"></i> Payment verified';
          // Show info box with details
          document.getElementById('info-box').style.display = '';
          document.getElementById('status-val').textContent  = 'Paid ✓';
          if (data.amount) {
            document.getElementById('amount-row').style.display = '';
            document.getElementById('amount-val').textContent   = data.amount.toLocaleString('fr-DZ') + ' DA';
          }
        } else {
          badge.className = 'verify-badge unverified';
          badge.innerHTML = '<i class="fa-solid fa-clock"></i> Processing…';
        }
      })
      .catch(() => {
        const badge = document.getElementById('verify-badge');
        badge.className = 'verify-badge unverified';
        badge.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Could not verify — check My Products later';
      });
  } else {
    // No checkout_id available — hide the badge
    document.getElementById('verify-badge').style.display = 'none';
  }

})();
</script>

<!-- ── Backend URL configuration ──────────────────────────────────────
     Change this to your actual backend URL before deploying.
     In development this is http://localhost:3001
     In production this is https://yourdomain.com
     ─────────────────────────────────────────────────────────────── -->
<script>
  window.DIGISTORE_BACKEND_URL = 'https://digital-website.chakchak1256.workers.dev';
</script>

</body>
</html>
